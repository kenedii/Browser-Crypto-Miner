<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Bitcoin Miner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 40px;
            padding-bottom: 50px;
            overflow-y: auto;
            overflow-x: hidden;
            color: white;
            font-family: "Segoe UI", "Inter", sans-serif;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a0033 100%);
            position: relative;
        }

        #miner-app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 20px;
            pointer-events: auto;
        }

        h2 {
            text-align: center;
            margin-top: 100px;
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="miner-app-container">
        <h2>Loading Mining Interface...</h2>
    </div>

    <script src="sha256.js"></script>

    <script src="miner.js"></script>
</body>
</html>
