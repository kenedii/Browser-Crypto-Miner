<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Crypto Miner - BTC, LTC, DOGE, XMR</title>
    <meta name="description" content="Mine real Bitcoin, Litecoin, Dogecoin and Monero proof-of-work from a browser tab. Open source research project.">
    <meta name="theme-color" content="#020504">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020504;
            --g: #00ff66; --b: #19a7ff; --r: #ff2a4d;
            --ink: #d8f5ff; --dim: #5d7a80; --line: rgba(160, 220, 255, .22);
            --panel: rgba(4, 14, 20, .72);
            --mono: 'Share Tech Mono', ui-monospace, monospace;
            --wide: 'Michroma', 'Eurostile', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { background: var(--bg); }
        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--mono);
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        a { color: inherit; text-decoration: none; }

        /* ---- background layers (same stack as tensors.vip, minus the intro) ---- */
        #cubes, #rain { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        #rain { opacity: .32; }
        .scan { position: fixed; inset: 0; pointer-events: none; z-index: 50;
            background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.22) 2px 3px);
            mix-blend-mode: multiply; }
        .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 49;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,.75) 100%); }
        .hint { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 20;
            font-family: var(--wide); font-size: 7px; letter-spacing: .4em; color: rgba(216,245,255,.45);
            white-space: nowrap; pointer-events: none; transition: opacity 1s; }
        .hint.used { opacity: 0; }

        /* ---- page frame ---- */
        #stage { position: relative; z-index: 5; min-height: 100vh; padding: 28px 16px 56px; pointer-events: none; }
        .frame { width: min(100%, 860px); margin: 0 auto; pointer-events: auto; }
        #miner-app-container { width: 100%; }

        .strip { height: 28px; display: flex; align-items: center;
            border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
            background: linear-gradient(180deg, rgba(40,60,70,.55), rgba(10,20,26,.85)); overflow: hidden; }
        .chev { font-family: var(--wide); font-size: 9px; color: var(--ink); padding: 0 10px; letter-spacing: -.1em;
            border-right: 1px solid var(--line); height: 100%; display: flex; align-items: center; }
        .tab { position: relative; height: 100%; display: flex; align-items: center; gap: 8px; padding: 0 20px;
            font-family: var(--wide); font-size: 10px; letter-spacing: .4em; color: #fff; white-space: nowrap;
            border-right: 1px solid var(--line);
            background: linear-gradient(180deg, rgba(0,255,102,.18), rgba(0,255,102,.03)); transition: background .2s; }
        .tab::before { content: ""; width: 5px; height: 5px; background: var(--g); box-shadow: 0 0 6px var(--g); animation: blink 1.2s steps(2) infinite; }
        .tab:hover, .tab:focus-visible { background: linear-gradient(180deg, rgba(0,255,102,.45), rgba(0,255,102,.1)); outline: none; }
        .tab .arrow { font-size: 8px; opacity: .6; letter-spacing: 0; }
        @keyframes blink { 50% { opacity: .2; } }
        .tick { flex: 1; height: 100%; overflow: hidden; position: relative; font-size: 10px; color: rgba(140,190,200,.45); white-space: nowrap; }
        .tick b { position: absolute; top: 50%; left: 0; font-weight: 400; display: inline-block;
            transform: translateY(-50%); animation: ticker 90s linear infinite; }
        .tick b .g { color: rgba(0,255,102,.55); } .tick b .r { color: rgba(255,42,77,.55); } .tick b .bl { color: rgba(25,167,255,.6); }
        @keyframes ticker { from { transform: translate(0, -50%); } to { transform: translate(-50%, -50%); } }
        .stat { padding: 0 12px; font-size: 9px; letter-spacing: .3em; color: var(--dim); border-left: 1px solid var(--line);
            height: 100%; display: flex; align-items: center; white-space: nowrap; }
        .stat em { font-style: normal; color: var(--g); }

        .window { position: relative; border-left: 1px solid var(--line); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
            background: linear-gradient(180deg, rgba(3,18,28,.86), rgba(2,10,16,.92)); }
        .corner { position: absolute; width: 14px; height: 14px; border-color: rgba(220,245,255,.45); border-style: solid; pointer-events: none; }
        .corner.tl { left: 8px; top: 8px; border-width: 1px 0 0 1px; } .corner.tr { right: 8px; top: 8px; border-width: 1px 1px 0 0; }
        .corner.bl { left: 8px; bottom: 8px; border-width: 0 0 1px 1px; } .corner.br { right: 8px; bottom: 8px; border-width: 0 1px 1px 0; }

        .banner { position: relative; padding: 38px 16px 30px; text-align: center; border-bottom: 1px solid var(--line);
            background:
              radial-gradient(ellipse at 72% 45%, rgba(25,167,255,.30), transparent 55%),
              radial-gradient(ellipse at 20% 80%, rgba(0,255,102,.12), transparent 50%),
              radial-gradient(ellipse at 90% 100%, rgba(255,42,77,.14), transparent 45%); }
        .banner h1 { font-family: var(--wide); font-weight: 400; font-size: clamp(22px, 5.6vw, 48px); letter-spacing: .08em; line-height: 1.1;
            color: #fff; text-shadow: 0 0 22px rgba(25,167,255,.55); }
        .banner h1 .dot { color: var(--g); text-shadow: 0 0 14px var(--g); }
        .banner .sub { margin-top: 14px; font-family: var(--wide); font-size: 8px; letter-spacing: .4em; color: rgba(216,245,255,.6); line-height: 1.9; }
        .banner .sub .z { color: var(--g); } .banner .sub .o { color: var(--b); } .banner .sub .x { color: var(--r); }

        /* ---- miner panel (markup is generated by miner.js) ---- */
        .miner-panel { padding: 26px 26px 8px; }
        .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .field { margin-bottom: 18px; min-width: 0; }
        .field label, .lbl { display: block; font-family: var(--wide); font-size: 8px; letter-spacing: .3em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
        .miner-panel select, .miner-panel input[type=text], .miner-panel input[type=number], .miner-panel input[type=password] {
            width: 100%; background: rgba(0,0,0,.4); border: 1px solid var(--line); color: var(--ink); padding: 11px 12px; border-radius: 0;
            font-family: var(--mono); font-size: 14px; outline: none; transition: border-color .2s, box-shadow .2s; }
        .miner-panel input[type=text], .miner-panel input[type=password], .miner-panel input[type=number] { margin-bottom: 0; }
        #custom-pool-group input { margin-bottom: 8px; }
        .miner-panel select option { background: #04121a; color: var(--ink); }
        .miner-panel select:focus, .miner-panel input:focus { border-color: var(--g); box-shadow: 0 0 0 1px rgba(0,255,102,.35), 0 0 14px rgba(0,255,102,.15); }
        .miner-panel input:disabled, .miner-panel select:disabled { opacity: .5; cursor: not-allowed; }
        .miner-panel input::placeholder { color: rgba(93,122,128,.8); }
        .miner-panel input[type=range] { width: 100%; accent-color: var(--g); }
        #address-hint { margin-top: 8px; font-size: 12px; line-height: 1.5; color: rgba(216,245,255,.6); display: none; }
        #address-hint code { background: rgba(0,0,0,.4); padding: 1px 5px; border: 1px solid var(--line); }
        #pool-dashboard { margin-top: 10px; display: none; }
        #pool-dashboard a { color: var(--b); font-size: 13px; border-bottom: 1px solid rgba(25,167,255,.4); }
        #pool-dashboard a:hover { color: var(--g); border-color: var(--g); }

        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; margin-top: 8px; border: 1px solid var(--line); background: var(--line); }
        .stat-item { background: rgba(2,10,16,.92); padding: 16px 8px; text-align: center; min-width: 0; }
        .stat-value { font-size: 19px; color: #fff; margin-bottom: 6px; font-feature-settings: 'tnum'; text-shadow: 0 0 12px rgba(25,167,255,.35);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .stat-label { font-family: var(--wide); font-size: 7px; letter-spacing: .25em; color: var(--dim); text-transform: uppercase; }
        #hashrate { color: var(--g); text-shadow: 0 0 12px rgba(0,255,102,.45); }
        #network-status { font-size: 14px; color: var(--dim); }

        #status { margin-top: 14px; font-size: 12px; color: rgba(216,245,255,.6); text-align: center; min-height: 1.5em; letter-spacing: .06em; }

        .miner-console { margin-top: 14px; background: rgba(0,0,0,.5); border: 1px solid var(--line); padding: 10px 12px; }
        .console-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .console-head .lbl { margin: 0; }
        #console-clear { background: transparent; border: 1px solid var(--line); color: var(--dim); font-family: var(--wide); font-size: 7px; letter-spacing: .25em;
            padding: 5px 9px; cursor: pointer; text-transform: uppercase; transition: color .2s, border-color .2s; }
        #console-clear:hover { color: var(--g); border-color: var(--g); }
        #console-log { height: 190px; overflow-y: auto; font-size: 12px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
        #console-log::-webkit-scrollbar { width: 6px; } #console-log::-webkit-scrollbar-thumb { background: var(--line); }

        .btn-row { display: flex; gap: 12px; margin: 22px 0 26px; }
        .btn { flex: 1; padding: 14px; font-family: var(--wide); font-size: 10px; letter-spacing: .4em; text-transform: uppercase; color: #fff; cursor: pointer;
            border: 1px solid var(--line); border-radius: 0; transition: background .2s, box-shadow .2s, opacity .2s; }
        #start-btn { background: linear-gradient(180deg, rgba(0,255,102,.28), rgba(0,255,102,.05)); border-color: rgba(0,255,102,.6); }
        #start-btn:hover:not(:disabled) { background: linear-gradient(180deg, rgba(0,255,102,.5), rgba(0,255,102,.12)); box-shadow: 0 0 18px rgba(0,255,102,.3); }
        #stop-btn { background: linear-gradient(180deg, rgba(255,42,77,.22), rgba(255,42,77,.04)); border-color: rgba(255,42,77,.55); }
        #stop-btn:hover:not(:disabled) { background: linear-gradient(180deg, rgba(255,42,77,.45), rgba(255,42,77,.1)); box-shadow: 0 0 18px rgba(255,42,77,.25); }
        .btn:disabled { opacity: .35; cursor: not-allowed; }

        /* ---- FAQ drop-down ---- */
        .faq { border-top: 1px solid var(--line); }
        .faq-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 16px 26px; cursor: pointer;
            background: linear-gradient(180deg, rgba(40,60,70,.35), rgba(10,20,26,.6)); border: 0; color: #fff;
            font-family: var(--wide); font-size: 10px; letter-spacing: .5em; text-transform: uppercase; transition: background .2s; }
        .faq-btn:hover, .faq-btn:focus-visible { background: linear-gradient(180deg, rgba(0,255,102,.2), rgba(0,255,102,.04)); outline: none; }
        .faq-btn .arrow { color: var(--g); transition: transform .35s ease; letter-spacing: 0; }
        .faq-btn[aria-expanded="true"] .arrow { transform: rotate(180deg); }
        .faq-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s cubic-bezier(.7,0,.2,1); }
        .faq-body.open { grid-template-rows: 1fr; }
        .faq-inner { overflow: hidden; min-height: 0; }
        .faq-content { padding: 6px 26px 28px; font-size: 13px; line-height: 1.65; color: rgba(216,245,255,.82); }
        .faq-content h3 { font-family: var(--wide); font-weight: 400; font-size: 9px; letter-spacing: .3em; color: var(--g); text-transform: uppercase; margin: 22px 0 8px; }
        .faq-content p + p { margin-top: 8px; }
        .faq-content strong { color: #fff; font-weight: 400; }
        .faq-content em { color: var(--b); font-style: normal; }
        .faq-content code { background: rgba(0,0,0,.4); padding: 1px 5px; border: 1px solid var(--line); font-size: 12px; }
        .faq-content ul { margin: 8px 0 0 18px; } .faq-content li { margin-bottom: 4px; }

        @media (max-width: 680px) {
            #stage { padding: 16px 10px 48px; }
            .miner-panel { padding: 20px 16px 4px; }
            .row2 { grid-template-columns: 1fr; gap: 0; }
            .stats { grid-template-columns: repeat(2, 1fr); }
            .stat { display: none; }
            .tab { padding: 0 12px; letter-spacing: .25em; }
            .faq-btn, .faq-content { padding-left: 16px; padding-right: 16px; }
            .banner .sub { letter-spacing: .25em; }
            .hint { display: none; }
        }
        @media (prefers-reduced-motion: reduce) { .tick b, .tab::before { animation: none; } }
    </style>
</head>
<body>
    <canvas id="cubes" aria-hidden="true"></canvas>
    <canvas id="rain" aria-hidden="true"></canvas>
    <div class="vignette"></div>
    <div class="scan"></div>
    <div class="hint" id="hint" aria-hidden="true">DRAG TO LOOK · CLICK TO PULSE</div>

    <main id="stage">
        <div class="frame">
            <nav class="strip" aria-label="Primary">
                <span class="chev" aria-hidden="true">&gt;&gt;</span>
                <a class="tab" href="https://tensors.vip/">TENSORS.VIP <span class="arrow">&#8599;</span></a>
                <div class="tick" aria-hidden="true"><b id="tick1"></b></div>
                <span class="stat">ALGOS <em>4</em></span>
                <span class="stat">BRIDGE <em>WSS</em></span>
            </nav>

            <div class="window">
                <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
                <header class="banner">
                    <h1>MINER<span class="dot">.</span>TENSORS<span class="dot">.</span>VIP</h1>
                    <p class="sub"><span class="o">BTC</span> &middot; <span class="z">LTC</span> &middot; <span class="x">DOGE</span> &middot; <span class="o">XMR</span><br>REAL PROOF-OF-WORK, RIGHT IN YOUR BROWSER TAB</p>
                </header>
                <div id="miner-app-container">
                    <p style="padding: 40px 16px; text-align: center; letter-spacing: .3em; color: var(--dim);">LOADING MINING INTERFACE...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Proof-of-work maths, one file per algorithm family. miner.js needs the
         BTC double-SHA-256 helpers (tile math + the WebGPU kernel) and the
         RandomX protocol/C ABI seam (window.XmrCrypto) in the page; scrypt.js is
         only ever importScripts'ed inside scrypt-worker.js, so it is not loaded
         here. randomx.wasm itself is fetched by xmr-worker.js on demand - if it
         is missing the Monero worker reports that and mines nothing. -->
    <script src="sha256.js"></script>
    <script src="randomx.js"></script>

    <script src="miner.js"></script>

    <!-- Decorative background only (cube lattice + binary rain). The miner
         works the same if three.js is blocked or WebGL is unavailable. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="lattice.js"></script>
</body>
</html>
