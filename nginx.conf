# Minimal static-file server for Cloud Run. All of the heavy lifting (the
# WebSocket stratum bridge and every byte of mining traffic) happens on the VPS,
# so this container only ever serves two cacheable files and stays cheap.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/html text/css application/javascript application/json image/svg+xml;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # HTML and the miner bundle always revalidate, so a deploy takes effect on the
    # next load. Cloud Run answers with 304 Not Modified when nothing changed, so
    # repeat visits stay cheap. (A plain max-age would leave browsers on the old
    # miner.js for up to an hour after a deploy.)
    location = / {
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The miner bundle revalidates too: it is un-hashed, so a stale cached copy
    # would silently keep running old code after a deploy.
    location = /miner.js {
        add_header Cache-Control "no-cache";
    }

    location = /sha256.js {
        add_header Cache-Control "no-cache";
    }

    location = /miner-worker.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
