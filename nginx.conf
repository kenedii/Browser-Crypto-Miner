# Minimal static-file server for Cloud Run. All of the heavy lifting (the
# WebSocket stratum bridge and every byte of mining traffic) happens on the VPS,
# so this container only ever serves two cacheable files and stays cheap.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/html text/css application/javascript application/json application/wasm image/svg+xml;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # HTML and the miner bundle always revalidate, so a deploy takes effect on the
    # next load. Cloud Run answers with 304 Not Modified when nothing changed, so
    # repeat visits stay cheap. (A plain max-age would leave browsers on the old
    # miner.js for up to an hour after a deploy.)
    location = / {
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Miner bundles and workers revalidate too: they are un-hashed, so a stale
    # cached copy would silently keep running old code after a deploy. This covers
    # sha256.js, randomx.js and every *_worker.js / *.js this page ships.
    location ~* \.js$ {
        add_header Cache-Control "no-cache";
    }

    # The RandomX VM is a build artefact (WebRandomX/) and can be a few hundred KB
    # to a few MB, so it must be served with the WebAssembly MIME type. It still
    # revalidates: a rebuilt VM (new epoch / different flags) must not be masked by
    # a stale cached copy. Absent file = plain 404, which the Monero worker reports.
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
