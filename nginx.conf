# Minimal static-file server for Cloud Run. All of the heavy lifting (the
# WebSocket stratum bridge and every byte of mining traffic) happens on the VPS,
# so this container only ever serves two cacheable files and stays cheap.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/html text/css application/javascript application/json image/svg+xml;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The HTML shell always revalidates so a deploy takes effect immediately.
    location = / {
        add_header Cache-Control "no-cache";
    }

    # The miner bundle is cacheable, so repeat visits are served from the
    # browser cache instead of waking Cloud Run.
    location = /miner.js {
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        add_header Cache-Control "public, max-age=600";
        try_files $uri $uri/ /index.html;
    }
}
