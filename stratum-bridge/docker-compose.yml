services:
  bridge:
    build: .
    restart: unless-stopped
    environment:
      - PORT=8080
      # Solo pool (miner keeps the full block reward if they solve a block)
      - BTC_POOL_HOST=solo.ckpool.org
      - BTC_POOL_PORT=3333
      # Tensors.vip shared pool (PPLNS) - point at your PPLNS pool backend
      - PPLNS_POOL_HOST=stratum.kano.is
      - PPLNS_POOL_PORT=3333
      - BTC_DEV_FEE_ADDRESS=1Datura3728Ch3cGDiSouKcDB7Cxf9vvb6
      # Custom-pool routing (set ALLOW_CUSTOM_POOLS=0 to disable entirely)
      - ALLOW_CUSTOM_POOLS=1
      - CUSTOM_POOL_PORTS=3333,3334,3335,3336,443,4443,4444,8332,8111,9332,9333,8888,14333
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - bridge
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
